services:
  # ==========================================================================================
  # 0.API & Workers Unificados
  # ==========================================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jungle_api_app
    ports:
      - "3000:3000"
    environment:
      - SUPPORTED_CURRENCIES=BRL,USD,EUR
      - INITIAL_WALLET_VERSION=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=jungle_user
      - DB_PASSWORD=jungle_password
      - DB_NAME=jungle_wagering_ledger
      - DB_SSLMODE=disable
      - AWS_REGION=us-east-1
      - SQS_ENDPOINT=http://localstack:4566
      - WAGER_QUEUE_URL=http://localstack:4566/000000000000/wager-transactions.fifo
      - IDP_ISSUER_URL=http://keycloak:8080/realms/jungle
      - IDP_JWKS_URL=http://keycloak:8080/realms/jungle/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - jungle_network

  # ==========================================================================================
  # 1. Banco de Dados: PostgreSQL
  # ==========================================================================================
  postgres:
    image: postgres:15-alpine
    container_name: jungle_postgres
    environment:
      POSTGRES_USER: jungle_user
      POSTGRES_PASSWORD: jungle_password
      POSTGRES_DB: jungle_wagering_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle_user -d jungle_wagering_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jungle_network

  # ==========================================================================================
  # 2. Mensageria: LocalStack (Simulador AWS SQS)
  # ==========================================================================================
  localstack:
    image: localstack/localstack:latest
    container_name: jungle_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "./infra/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh"
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jungle_network

  # ==========================================================================================
  # 3. Autenticação e Autorização: Keycloak (OAuth 2.0 / OIDC IdP)
  # ==========================================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: jungle_keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - "./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro"
    healthcheck:
      test: ["CMD", "exec", "3<>/dev/tcp/localhost/8080", "&&", "echo", "-e", "\"GET /health/live HTTP/1.1\\nHost: localhost\\n\\n\"", ">&3", "&&", "close", "3"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jungle_network

volumes:
  postgres_data:
    driver: local
  localstack_data:
    driver: local

networks:
  jungle_network:
    name: jungle_network
    driver: bridge
