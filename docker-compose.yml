
services:
  # ==========================================================================================
  # 0. API & Workers Unificados
  # ==========================================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jungle_api_app
    ports:
      - "3000:3000"
    environment:
      - SUPPORTED_CURRENCIES=BRL,USD,EUR
      - INITIAL_WALLET_VERSION=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=jungle_user
      - DB_PASSWORD=jungle_password
      - DB_NAME=jungle_wagering_ledger
      - DB_SSLMODE=disable
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_ENDPOINT=http://localstack:4566
      - WAGER_QUEUE_URL=http://localstack:4566/000000000000/wager-transactions.fifo
      - EVENTS_QUEUE_URL=http://localstack:4566/000000000000/wager-events
      - IDP_ISSUER_URL=http://localhost:8080/realms/jungle
      - IDP_JWKS_URL=http://keycloak:8080/realms/jungle/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - jungle_network

  # ==========================================================================================
  # 1. Banco de Dados: PostgreSQL
  # ==========================================================================================
  postgres:
    image: postgres:15-alpine
    container_name: jungle_postgres
    environment:
      POSTGRES_USER: jungle_user
      POSTGRES_PASSWORD: jungle_password
      POSTGRES_DB: jungle_wagering_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle_user -d jungle_wagering_ledger"]
      interval: 4s
      timeout: 3s
      retries: 40
      start_period: 40s
    networks:
      - jungle_network

  # ==========================================================================================
  # 2. Mensageria: LocalStack Real (Simulador AWS SQS Oficial)
  # ==========================================================================================
  localstack:
    image: localstack/localstack:3.0.0
    container_name: jungle_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_DELAY_PURGE_RETRY=0
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo || exit 1"]
      interval: 4s
      timeout: 3s
      retries: 40
      start_period: 40s
    networks:
      - jungle_network

  # ==========================================================================================
  # 3. Autenticação e Autorização: Keycloak (OAuth 2.0 / OIDC IdP)
  # ==========================================================================================
  keycloak:
    image: keycloak/keycloak:22.0.1
    container_name: jungle_keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    ports:
      - "8080:8080"
    volumes:
      - "./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'HTTP/1.1 200 OK'"]
      interval: 4s
      timeout: 3s
      retries: 40
      start_period: 40s
    networks:
      - jungle_network

volumes:
  postgres_data:
    driver: local
  localstack_data:
    driver: local

networks:
  jungle_network:
    name: jungle_network
    driver: bridge
